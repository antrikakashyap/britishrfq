<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">British Auction RFQ</title>
  <desc id="d">Suppliers lower their prices, late bids add time, and a forced close ends the auction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1f2e"/><stop offset="1" stop-color="#1d3a52"/></linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#37506a"/><rect width="4" height="8" fill="#4b6781"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect x="48" y="44" width="40" height="40" rx="9" fill="#f2a900"/>
  <path d="M57 73h14M57 64h22M57 55h10" stroke="#0f1f2e" stroke-width="4" stroke-linecap="round"/>
  <text x="104" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#c5d1dc">RFQ platform</text>
  <text x="48" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">British Auction RFQ</text>
  <text x="48" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#c5d1dc">Suppliers lower their price. Late bids buy everyone more time. A forced close ends it.</text>
  <!-- timeline strip -->
  <g transform="translate(48,236)">
    <rect x="0" y="12" width="620" height="14" rx="7" fill="url(#hatch)"/>
    <rect x="0" y="12" width="400" height="14" rx="7" fill="#ffffff"/>
    <rect x="400" y="12" width="70" height="14" fill="#f2a900"/>
    <rect x="340" y="2" width="60" height="34" rx="6" fill="rgba(242,169,0,.18)" stroke="#f2a900" stroke-width="2.5"/>
    <rect x="617" y="0" width="5" height="38" rx="2" fill="#ff6b5c"/>
    <circle cx="372" cy="19" r="7" fill="#19c3a3" stroke="#0f1f2e" stroke-width="3"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c5d1dc">
      <text x="0" y="62">Bidding open</text>
      <text x="338" y="62" fill="#ffd067">Late bid arrives</text>
      <text x="446" y="62" fill="#ffd067">+ time added</text>
      <text x="540" y="62" fill="#ff9d92">Forced close</text>
    </g>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
    <rect x="760" y="226" width="392" height="58" rx="10" fill="rgba(255,255,255,.08)"/>
    <text x="780" y="252" font-size="15" fill="#c5d1dc">Live demo: place a bid and watch the clock grow</text>
    <text x="780" y="274" font-size="15" font-weight="600" fill="#ffd067">british-auction-rfq-3cc2.onrender.com</text>
  </g>
</svg>
